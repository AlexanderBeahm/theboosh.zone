# docker-compose.staging.yml - Staging Environment
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        BUILD_ENV: staging
    image: ghcr.io/alexanderbeahm/theboosh-zone:staging-latest
    ports:
      - "8080:8080"
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      MOJO_MODE: staging
      NODE_ENV: production
      DB_SCHEMA: thebooshzone_staging
    volumes:
      - uploads_data:/usr/src/hello-perld/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
      - letsencrypt:/etc/letsencrypt:ro
      - letsencrypt-www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=200h'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  uploads_data:
  prometheus_data:
  grafana_data:
  letsencrypt:
  letsencrypt-www:
