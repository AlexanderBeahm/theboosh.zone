# docker-compose.staging.yml - Staging Environment
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
            args:
                BUILD_ENV: staging
        image: registry.digitalocean.com/thebooshzone/theboosh-zone:staging-latest
        ports:
            - "8080:8080"
        env_file:
            - .env.staging
        environment:
            APP_ENV: staging
            MOJO_MODE: staging
            NODE_ENV: production
            DB_SCHEMA: thebooshzone_staging
        volumes:
            - /mnt/volume_sfo3_01/hello-perld-staging/uploads:/usr/src/hello-perld/uploads
        networks:
            - theboosh-staging-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
            - /mnt/volume_sfo3_01/hello-perld-staging/uploads:/usr/share/nginx/html/uploads:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - /var/www/certbot:/var/www/certbot:ro
        networks:
            - theboosh-staging-network
        depends_on:
            - app
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:latest
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
            - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=360h"
        networks:
            - theboosh-staging-network
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
        networks:
            - theboosh-staging-network
        depends_on:
            - prometheus
        restart: unless-stopped

    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:latest
        command:
            - -nginx.scrape-uri=http://nginx:8080/stub_status
        ports:
            - "127.0.0.1:9113:9113"
        networks:
            - theboosh-staging-network
        depends_on:
            - nginx
        restart: unless-stopped

    node-exporter:
        image: prom/node-exporter:latest
        ports:
            - "127.0.0.1:9100:9100"
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - "--path.procfs=/host/proc"
            - "--path.rootfs=/rootfs"
            - "--path.sysfs=/host/sys"
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
        networks:
            - theboosh-staging-network
        restart: unless-stopped

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:latest
        ports:
            - "127.0.0.1:9187:9187"
        environment:
            DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require"
        networks:
            - theboosh-staging-network
        restart: unless-stopped

    alertmanager:
        build:
            context: .
            dockerfile: Dockerfile.alertmanager
        ports:
            - "127.0.0.1:9093:9093"
        volumes:
            - alertmanager_data:/alertmanager
        environment:
            - APP_ENV=staging
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
            - ALERT_EMAIL=${ALERT_EMAIL}
            - SMTP_FROM=${SMTP_FROM}
            - SMTP_USERNAME=${SMTP_USERNAME}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - SMTP_SERVER=${SMTP_SERVER}
        networks:
            - theboosh-staging-network
        depends_on:
            - prometheus
            - alertmanager-discord
        restart: unless-stopped

    alertmanager-discord:
        image: benjojo/alertmanager-discord
        environment:
            - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL}
        networks:
            - theboosh-staging-network
        restart: unless-stopped

    cron:
        build:
            context: .
            dockerfile: Dockerfile.cron
        environment:
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            DB_SCHEMA: thebooshzone_staging
        networks:
            - theboosh-staging-network
        restart: unless-stopped

networks:
    theboosh-staging-network:
        driver: bridge
        name: theboosh-staging-network

volumes:
    prometheus_data:
    grafana_data:
    alertmanager_data:
