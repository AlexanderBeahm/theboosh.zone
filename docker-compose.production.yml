# docker-compose.production.yml - Production Environment
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
            args:
                BUILD_ENV: production
        image: registry.digitalocean.com/thebooshzone/theboosh-zone:production-latest
        ports:
            - "8080:8080"
        env_file:
            - .env.production
        environment:
            APP_ENV: production
            MOJO_MODE: production
            NODE_ENV: production
            DB_SCHEMA: thebooshzone_prod
        volumes:
            - /mnt/volume_nyc3_01/hello-perld-prod/uploads:/usr/src/hello-perld/uploads
        networks:
            - theboosh-production-network
        restart: always
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                limits:
                    memory: 2G
                    cpus: "2"
                reservations:
                    memory: 1G
                    cpus: "1"
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/generated/production.conf:/etc/nginx/conf.d/default.conf:ro
            - /mnt/volume_nyc3_01/hello-perld-prod/uploads:/usr/share/nginx/html/uploads:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - /var/www/certbot:/var/www/certbot:ro
        networks:
            - theboosh-production-network
        depends_on:
            - app
        restart: always
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    certbot:
        image: certbot/certbot
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt
            - /var/www/certbot:/var/www/certbot
        networks:
            - theboosh-production-network
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

    prometheus:
        image: prom/prometheus:latest
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=200h"
        networks:
            - theboosh-production-network
        restart: always

    grafana:
        image: grafana/grafana:latest
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_SERVER_ROOT_URL=https://monitoring.theboosh.zone
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - theboosh-production-network
        depends_on:
            - prometheus
        restart: always

networks:
    theboosh-production-network:
        driver: bridge
        name: theboosh-production-network

volumes:
    prometheus_data:
    grafana_data:
