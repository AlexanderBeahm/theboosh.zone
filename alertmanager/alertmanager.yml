# AlertManager Configuration for TheBoosh.Zone
# Discord webhook URL should be set via environment variable

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord-notifications'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'discord-critical'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'discord-warnings'
      repeat_interval: 4h

receivers:
  # Default receiver
  - name: 'discord-notifications'
    slack_configs:
      # Discord webhooks support Slack format with /slack suffix
      - api_url: '${DISCORD_WEBHOOK_URL}/slack'
        channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Critical alerts (Discord + Email backup)
  - name: 'discord-critical'
    slack_configs:
      - api_url: '${DISCORD_WEBHOOK_URL}/slack'
        channel: '#alerts-critical'
        send_resolved: true
        title: 'CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'danger'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] TheBoosh.Zone Alert: {{ .CommonAnnotations.summary }}'

  # Warning alerts (Discord only)
  - name: 'discord-warnings'
    slack_configs:
      - api_url: '${DISCORD_WEBHOOK_URL}/slack'
        channel: '#alerts'
        send_resolved: true
        title: 'Warning: {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'warning'

inhibit_rules:
  # If critical is firing, suppress warning for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

templates:
  - '/etc/alertmanager/templates/*.tmpl'
