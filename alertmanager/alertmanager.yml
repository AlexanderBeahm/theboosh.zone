# AlertManager Configuration for TheBoosh.Zone
# Discord webhook URL should be set via environment variable

global:
    resolve_timeout: 5m
    smtp_smarthost: "smtp.protonmail.ch:587"
    smtp_from: "${SMTP_FROM}"
    smtp_auth_username: "${SMTP_USERNAME}"
    smtp_auth_password: "${SMTP_PASSWORD}"
    smtp_require_tls: true

route:
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    receiver: "discord-notifications"
    routes:
        # Critical alerts - immediate notification
        - match:
              severity: critical
          receiver: "discord-critical"
          group_wait: 10s
          repeat_interval: 1h

        # Warning alerts - less frequent
        - match:
              severity: warning
          receiver: "discord-warnings"
          repeat_interval: 4h

receivers:
    # Default receiver
    - name: "discord-notifications"
      webhook_configs:
          - url: "http://alertmanager-discord:9094"
            send_resolved: true

    # Critical alerts (Discord + Email backup)
    - name: "discord-critical"
      webhook_configs:
          - url: "http://alertmanager-discord:9094"
            send_resolved: true
      email_configs:
          - to: "${ALERT_EMAIL}"
            send_resolved: true
            headers:
                subject: "[CRITICAL] TheBoosh.Zone Alert: {{ .CommonAnnotations.summary }}"

    # Warning alerts (Discord + Email)
    - name: "discord-warnings"
      webhook_configs:
          - url: "http://alertmanager-discord:9094"
            send_resolved: true
      email_configs:
          - to: "${ALERT_EMAIL}"
            send_resolved: true
            headers:
                subject: "[WARNING] TheBoosh.Zone Alert: {{ .CommonAnnotations.summary }}"

inhibit_rules:
    # If critical is firing, suppress warning for same alertname
    - source_match:
          severity: "critical"
      target_match:
          severity: "warning"
      equal: ["alertname"]
