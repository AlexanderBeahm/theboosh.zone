# Staging Deployment Workflow
#
# Deploys the application to the staging environment (https://staging.theboosh.zone)
#
# Process:
# 1. Calls ci.yml to run tests and build Docker image
# 2. SSHs to staging server
# 3. Pulls latest image from DigitalOcean Container Registry
# 4. Runs deployment script
# 5. Performs health check
#
# Security:
# - Uses base64-encoded Docker credentials for safe transport
# - Credentials automatically cleaned up via bash trap
# - Registry URL uses environment variables for consistency
#
# See .github/workflows/README.md for detailed documentation.

name: Deploy to Staging

# CURRENTLY DISABLED: Only manual triggers allowed
# To enable automatic deployment to staging, uncomment the lines below:
#
# on:
#   push:
#     branches: [ dev ]
#   workflow_dispatch:

# Manual trigger only (for testing before infrastructure is ready)
on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # Required for OIDC token generation

jobs:
    # Call the CI workflow which handles tests and building
    build:
        name: Build and Push Docker Image
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    deploy:
        name: Deploy to Staging Server
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: staging
            url: https://staging.theboosh.zone

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry
              run: doctl registry login --expiry-seconds 1200

            - name: Get Docker registry credentials
              id: registry-creds
              run: |
                  # Generate a short-lived registry token and encode with base64 for safe transport
                  DOCKER_CONFIG=$(doctl registry docker-config --read-write)
                  DOCKER_CONFIG_B64=$(echo "$DOCKER_CONFIG" | base64 -w 0)
                  echo "docker_config_b64=$DOCKER_CONFIG_B64" >> $GITHUB_OUTPUT

            - name: Deploy to server
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  envs: DOCKER_CONFIG_B64,DO_REGISTRY_NAME,REGISTRY
                  script: |
                      set -e  # Exit on any error

                      # Setup cleanup trap to ensure credentials are always removed
                      cleanup() {
                          rm -f ~/.docker/config.json
                      }
                      trap cleanup EXIT

                      cd /opt/theboosh-zone

                      # Decode and write docker credentials
                      mkdir -p ~/.docker
                      echo "$DOCKER_CONFIG_B64" | base64 -d > ~/.docker/config.json

                      # Pull latest image from DigitalOcean registry
                      docker pull ${REGISTRY}/${DO_REGISTRY_NAME}/theboosh-zone:staging-latest

                      # Run deployment script
                      ./deploy/deploy.sh staging

                      # Health check
                      sleep 10
                      curl -f https://staging.theboosh.zone/health || exit 1
              env:
                  DOCKER_CONFIG_B64: ${{ steps.registry-creds.outputs.docker_config_b64 }}
                  DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
                  REGISTRY: registry.digitalocean.com

            - name: Notify on success
              if: success()
              run: echo "Staging deployment successful!"

            - name: Notify on failure
              if: failure()
              run: |
                  echo "Staging deployment failed!"
                  # Add Slack/Discord/Email notification here if desired
