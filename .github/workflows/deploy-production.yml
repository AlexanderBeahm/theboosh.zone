# Production Deployment Workflow
#
# Deploys the application to the production environment (https://theboosh.zone)
#
# Process:
# 1. Calls ci.yml to run tests and build Docker image
# 2. Creates GitHub Release (if triggered by version tag)
# 3. SSHs to production server
# 4. Creates database backup
# 5. Pulls latest image from DigitalOcean Container Registry
# 6. Runs deployment script with health checks
# 7. Automatic rollback if health check fails
#
# Security:
# - Uses base64-encoded Docker credentials for safe transport
# - Credentials automatically cleaned up via bash trap
# - Registry URL uses environment variables for consistency
# - Requires manual approval via GitHub environment protection
#
# See .github/workflows/README.md for detailed documentation.

name: Deploy to Production

# CURRENTLY DISABLED: Only manual triggers allowed
# To enable automatic deployment to production, uncomment the lines below:
#
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'v*' ]
#   workflow_dispatch:

# Manual trigger only (for testing before infrastructure is ready)
on:
    workflow_dispatch:

permissions:
    contents: write # Required to create GitHub releases
    id-token: write # Required for OIDC token generation

jobs:
    # Call the CI workflow which handles tests and building
    build:
        name: Build and Push Docker Image
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: production
            url: https://theboosh.zone

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry
              run: doctl registry login --expiry-seconds 1200

            - name: Get Docker registry credentials
              id: registry-creds
              run: |
                  # Generate a short-lived registry token and encode with base64 for safe transport
                  DOCKER_CONFIG=$(doctl registry docker-config --read-write)
                  DOCKER_CONFIG_B64=$(echo "$DOCKER_CONFIG" | base64 -w 0)
                  echo "docker_config_b64=$DOCKER_CONFIG_B64" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true

            - name: Deploy to production server
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.PRODUCTION_HOST }}
                  username: ${{ secrets.PRODUCTION_USER }}
                  key: ${{ secrets.PRODUCTION_SSH_KEY }}
                  envs: DOCKER_CONFIG_B64,DO_REGISTRY_NAME,REGISTRY
                  script: |
                      set -e  # Exit on any error

                      # Setup cleanup trap to ensure credentials are always removed
                      cleanup() {
                          rm -f ~/.docker/config.json
                      }
                      trap cleanup EXIT

                      cd /opt/theboosh-zone

                      # Decode and write docker credentials
                      mkdir -p ~/.docker
                      echo "$DOCKER_CONFIG_B64" | base64 -d > ~/.docker/config.json

                      # Pull latest image from DigitalOcean registry
                      docker pull ${REGISTRY}/${DO_REGISTRY_NAME}/theboosh-zone:production-latest

                      # Backup current deployment
                      ./deploy/backup.sh production

                      # Run deployment script with health checks
                      ./deploy/deploy.sh production

                      # Verify deployment
                      sleep 15
                      if ! curl -f https://theboosh.zone/health; then
                        echo "Health check failed! Rolling back..."
                        ./deploy/rollback.sh production
                        exit 1
                      fi
              env:
                  DOCKER_CONFIG_B64: ${{ steps.registry-creds.outputs.docker_config_b64 }}
                  DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
                  REGISTRY: registry.digitalocean.com

            - name: Notify on success
              if: success()
              run: |
                  echo "Production deployment successful!"
                  # Add notification here if desired

            - name: Notify on failure
              if: failure()
              run: |
                  echo "Production deployment failed!"
                  # Add critical alert here if desired
