name: Deploy to Production

# CURRENTLY DISABLED: Only manual triggers allowed
# To enable automatic deployment to production, uncomment the lines below:
#
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'v*' ]
#   workflow_dispatch:

# Manual trigger only (for testing before infrastructure is ready)
on:
    workflow_dispatch:

jobs:
    # Call the CI workflow which handles tests and building
    build:
        name: Build and Push Docker Image
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: production
            url: https://theboosh.zone

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry
              run: doctl registry login --expiry-seconds 1200

            - name: Get Docker registry credentials
              id: registry-creds
              run: |
                  # Generate a short-lived registry token
                  DOCKER_CONFIG=$(doctl registry docker-config --read-write)
                  echo "docker_config<<EOF" >> $GITHUB_OUTPUT
                  echo "$DOCKER_CONFIG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true

            - name: Deploy to production server
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.PRODUCTION_HOST }}
                  username: ${{ secrets.PRODUCTION_USER }}
                  key: ${{ secrets.PRODUCTION_SSH_KEY }}
                  envs: DOCKER_CONFIG_JSON,DO_REGISTRY_NAME
                  script: |
                      cd /opt/theboosh-zone

                      # Create temporary docker config directory
                      mkdir -p ~/.docker
                      echo "$DOCKER_CONFIG_JSON" > ~/.docker/config.json

                      # Pull latest image from DigitalOcean registry
                      docker pull registry.digitalocean.com/${DO_REGISTRY_NAME}/theboosh-zone:production-latest

                      # Clean up credentials
                      rm -f ~/.docker/config.json

                      # Backup current deployment
                      ./deploy/backup.sh production

                      # Run deployment script with health checks
                      ./deploy/deploy.sh production

                      # Verify deployment
                      sleep 15
                      if ! curl -f https://theboosh.zone/health; then
                        echo "Health check failed! Rolling back..."
                        ./deploy/rollback.sh production
                        exit 1
                      fi
              env:
                  DOCKER_CONFIG_JSON: ${{ steps.registry-creds.outputs.docker_config }}
                  DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}

            - name: Notify on success
              if: success()
              run: |
                  echo "Production deployment successful!"
                  # Add notification here if desired

            - name: Notify on failure
              if: failure()
              run: |
                  echo "Production deployment failed!"
                  # Add critical alert here if desired
