name: Deploy to Production

# CURRENTLY DISABLED: Only manual triggers allowed
# To enable automatic deployment to production, uncomment the lines below:
#
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'v*' ]
#   workflow_dispatch:

# Manual trigger only (for testing before infrastructure is ready)
on:
    workflow_dispatch:

jobs:
    # Call the build workflow which handles tests and building
    build:
        name: Build and Push Docker Image
        uses: ./.github/workflows/build-digitalocean.yml
        secrets: inherit

    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: production
            url: https://theboosh.zone

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry
              run: doctl registry login --expiry-seconds 1200

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true

            - name: Deploy to production server
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.PRODUCTION_HOST }}
                  username: ${{ secrets.PRODUCTION_USER }}
                  key: ${{ secrets.PRODUCTION_SSH_KEY }}
                  script: |
                      cd /opt/theboosh-zone

                      # Pull latest image from DigitalOcean registry
                      doctl registry login --expiry-seconds 1200
                      docker pull registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/theboosh-zone:production-latest

                      # Backup current deployment
                      ./deploy/backup.sh production

                      # Run deployment script with health checks
                      ./deploy/deploy.sh production

                      # Verify deployment
                      sleep 15
                      if ! curl -f https://theboosh.zone/health; then
                        echo "Health check failed! Rolling back..."
                        ./deploy/rollback.sh production
                        exit 1
                      fi

            - name: Notify on success
              if: success()
              run: |
                  echo "Production deployment successful!"
                  # Add notification here if desired

            - name: Notify on failure
              if: failure()
              run: |
                  echo "Production deployment failed!"
                  # Add critical alert here if desired
