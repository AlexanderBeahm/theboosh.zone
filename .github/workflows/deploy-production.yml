name: Deploy to Production

# CURRENTLY DISABLED: Only manual triggers allowed
# To enable automatic deployment to production, uncomment the lines below:
#
# on:
#   push:
#     branches: [ main ]
#     tags: [ 'v*' ]
#   workflow_dispatch:

# Manual trigger only (for testing before infrastructure is ready)
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Full Test Suite
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production-latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=production-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          build-args: |
            BUILD_ENV=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://theboosh.zone

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/theboosh-zone

            # Pull latest image
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest

            # Backup current deployment
            ./deploy/backup.sh production

            # Run deployment script with health checks
            ./deploy/deploy.sh production

            # Verify deployment
            sleep 15
            if ! curl -f https://theboosh.zone/health; then
              echo "Health check failed! Rolling back..."
              ./deploy/rollback.sh production
              exit 1
            fi

      - name: Notify on success
        if: success()
        run: |
          echo "Production deployment successful!"
          # Add notification here if desired

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment failed!"
          # Add critical alert here if desired
