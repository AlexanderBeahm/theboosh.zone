name: Build and Push to DigitalOcean Container Registry

on:
    push:
        branches: ["main", "dev"]
        tags: ["v*"]
    pull_request:
        branches: ["main", "dev"]
    workflow_dispatch:
    workflow_call:
        outputs:
            image_tags:
                description: "Docker image tags that were built"
                value: ${{ jobs.build-and-push.outputs.image_tags }}
            image_digest:
                description: "Docker image digest"
                value: ${{ jobs.build-and-push.outputs.image_digest }}
            build_env:
                description: "Build environment used"
                value: ${{ jobs.build-and-push.outputs.build_env }}

env:
    REGISTRY: registry.digitalocean.com
    # Set your DigitalOcean registry name here (e.g., your-registry-name)
    DO_REGISTRY_NAME: ${{ secrets.DO_REGISTRY_NAME }}
    IMAGE_NAME: theboosh-zone

jobs:
    test:
        name: Run Tests
        # Run tests only when called from deployment workflows or manual triggers that need validation
        # Skip on push/PR events since test.yml runs directly for those
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/test.yml

    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [test]
        # Allow this job to run even if test job is skipped
        if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
        permissions:
            contents: read
        outputs:
            image_tags: ${{ steps.meta.outputs.tags }}
            image_digest: ${{ steps.build.outputs.digest }}
            build_env: ${{ steps.env.outputs.BUILD_ENV }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry with doctl
              run: doctl registry login --expiry-seconds 1200

            - name: Determine build environment
              id: env
              run: |
                  # For PRs, use the target branch (base_ref), otherwise use the ref
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    REF="refs/heads/${{ github.base_ref }}"
                  else
                    REF="${{ github.ref }}"
                  fi

                  if [[ "$REF" == "refs/heads/main" ]] || [[ "$REF" == refs/tags/* ]]; then
                    echo "BUILD_ENV=prod" >> $GITHUB_OUTPUT
                    echo "ENV_TAG=production" >> $GITHUB_OUTPUT
                  elif [[ "$REF" == "refs/heads/dev" ]]; then
                    echo "BUILD_ENV=staging" >> $GITHUB_OUTPUT
                    echo "ENV_TAG=staging" >> $GITHUB_OUTPUT
                  else
                    echo "BUILD_ENV=dev" >> $GITHUB_OUTPUT
                    echo "ENV_TAG=dev" >> $GITHUB_OUTPUT
                  fi

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # Use environment tag (production, staging, or dev)
                      type=raw,value=${{ steps.env.outputs.ENV_TAG }}-latest
                      # Add SHA for traceability
                      type=sha,prefix=${{ steps.env.outputs.ENV_TAG }}-
                      # Add semver tags for version tags
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Add branch name for non-main branches
                      type=ref,event=branch
                      # Add PR number for pull requests
                      type=ref,event=pr

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile.production
                  build-args: |
                      BUILD_ENV=${{ steps.env.outputs.BUILD_ENV }}
                  # Only push on push events, not on PRs
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Image digest
              run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"

            - name: Summary
              run: |
                  echo "## Docker Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Environment:** ${{ steps.env.outputs.ENV_TAG }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Build Environment:** ${{ steps.env.outputs.BUILD_ENV }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Tags:" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
