upstream app_backend {
    server app:8080 fail_timeout=10s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    server_name theboosh.zone www.theboosh.zone;

    # Block bad bots before redirect
    if ($is_bad_bot) {
        return 444;
    }

    # Block known malicious paths before redirect
    if ($is_blocked_path) {
        return 444;
    }

    # Let's Encrypt HTTP-01 challenge (must be on port 80)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://theboosh.zone$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.theboosh.zone;

    # SSL configuration (required even for redirects)
    ssl_certificate /etc/letsencrypt/live/theboosh.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theboosh.zone/privkey.pem;

    # Redirect www to non-www
    return 301 https://theboosh.zone$request_uri;
}

server {
    listen 443 ssl http2;
    server_name theboosh.zone;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/theboosh.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theboosh.zone/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security)
    # Force HTTPS connections for 2 years (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Additional security headers for defense in depth
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP) - Modern XSS protection
    # Note: Swagger routes will override this to allow inline scripts
    # Note: Using relative URLs for API calls, so connect-src only needs 'self'
    # Note: connect-src controls fetch/XHR (restricted), media-src controls audio/video loading (allows HTTPS for HLS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://*.bandcamp.com https://bandcamp.com https://youtube.com https://www.youtube.com https://youtube-nocookie.com https://www.youtube-nocookie.com https://youtu.be https://vimeo.com https://player.vimeo.com https://spotify.com https://open.spotify.com https://soundcloud.com https://w.soundcloud.com https://codepen.io https://codesandbox.io https://jsfiddle.net; upgrade-insecure-requests" always;

    # Block bad bots (close connection with no response)
    if ($is_bad_bot) {
        return 444;
    }

    # Block known malicious paths (close connection with no response)
    if ($is_blocked_path) {
        return 444;
    }

    # Limit concurrent connections per IP across this server
    limit_conn conn_limit 20;
    limit_conn_status 429;

    # Root directory for static files
    root /usr/share/nginx/html;

    # Serve uploaded media files directly from nginx
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve frontend static assets with aggressive caching
    location /dist/ {
        proxy_pass http://app_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 10M;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin login endpoint with specific rate limiting
    location /api/auth/login {
        limit_req zone=admin_login burst=5 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Other auth endpoints with general auth rate limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://app_backend;
        access_log off;
    }

    # Swagger documentation (consider removing in production)
    location /swagger {
        # Uncomment to require basic auth for Swagger in production
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        # Override CSP for Swagger UI (requires inline scripts)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /swagger.json {
        proxy_pass http://app_backend;
        expires 1h;
    }

    # All other requests go to Vue.js SPA
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Deny access to hidden files (excluding .well-known for ACME, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
