user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Default body size limit (overridden to 10M in upload locations)
    client_max_body_size 1k;

    # Drop slow/stalled connections quickly to mitigate slowloris-style probes
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Security headers (applied to all virtual hosts)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Block known malicious/scanner user agents (0 = allow, 1 = block)
    map $http_user_agent $is_bad_bot {
        default                     0;
        ""                          1;
        "~*nikto"                   1;
        "~*sqlmap"                  1;
        "~*nmap"                    1;
        "~*masscan"                 1;
        "~*zgrab"                   1;
        "~*gobuster"               1;
        "~*dirbuster"              1;
        "~*wfuzz"                   1;
        "~*ffuf"                    1;
        "~*nuclei"                  1;
        "~*httpx"                   1;
        "~*nessus"                  1;
        "~*openvas"                 1;
        "~*qualys"                  1;
        "~*w3af"                    1;
        "~*havij"                   1;
        "~*acunetix"               1;
        "~*netsparker"             1;
        "~*burpsuite"              1;
        "~*jaeles"                  1;
        "~*xray"                    1;
        "~*scanner"                 1;
        "~*exploit"                 1;
        "~*attack"                  1;
        "~*inject"                  1;
        "~*python-requests"         1;
        "~*go-http-client"          1;
        "~*libwww-perl"             1;
        "~*curl/"                   1;
        "~*wget/"                   1;
    }

    # Block known malicious request paths (0 = allow, 1 = block)
    map $request_uri $is_blocked_path {
        default                             0;
        "~*\.php"                           1;
        "~*\.asp"                           1;
        "~*\.aspx"                          1;
        "~*\.jsp"                           1;
        "~*/cgi-bin/"                       1;
        "~*/wp-admin"                       1;
        "~*/wp-login"                       1;
        "~*/wp-content"                     1;
        "~*/wp-includes"                    1;
        "~*/wordpress"                      1;
        "~*/wp-config"                      1;
        "~*/xmlrpc\.php"                    1;
        "~*/\.env"                          1;
        "~*/\.git"                          1;
        "~*/\.svn"                          1;
        "~*/\.hg"                           1;
        "~*/\.htaccess"                     1;
        "~*/\.htpasswd"                     1;
        "~*/\.DS_Store"                     1;
        "~*/\.vscode"                       1;
        "~*/\.idea"                         1;
        "~*/node_modules"                   1;
        "~*/vendor/"                        1;
        "~*/phpinfo"                        1;
        "~*/phpmyadmin"                     1;
        "~*/adminer"                        1;
        "~*/database\.yml"                  1;
        "~*/application\.yml"               1;
        "~*/config\.yml"                    1;
        "~*/credentials"                    1;
        "~*/aws/credentials"                1;
        "~*/docker-compose"                 1;
        "~*/Dockerfile"                     1;
        "~*/composer\.(json|lock)"          1;
        "~*/package-lock\.json"             1;
        "~*/Gemfile"                        1;
        "~*/\.aws"                          1;
        "~*/etc/passwd"                     1;
        "~*/etc/shadow"                     1;
        "~*/proc/self"                      1;
        "~*\.\./\.\."                       1;
        "~*/login\.cgi"                     1;
        "~*/setup\.cgi"                     1;
        "~*/shell"                          1;
        "~*/cmd"                            1;
        "~*/eval"                           1;
        "~*/exec"                           1;
        "~*/system"                         1;
        "~*/actuator"                       1;
        "~*/debug"                          1;
        "~*/console"                        1;
        "~*/manager"                        1;
        "~*/solr"                           1;
        "~*/jenkins"                        1;
        "~*/struts"                         1;
        "~*/jmx-console"                    1;
        "~*/invoker"                        1;
    }

    # Stub status server for Prometheus nginx-exporter (internal only)
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;  # Docker networks
            allow 10.0.0.0/8;     # Private networks
            allow 127.0.0.1;      # Localhost
            deny all;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
