# fail2ban jail for nginx scanner detection
# Deployed to /etc/fail2ban/jail.d/nginx-scanner.conf

[nginx-scanner]
enabled  = true
filter   = nginx-scanner
logpath  = /var/log/nginx/access.log
port     = http,https

# 10 matching requests within 5 minutes triggers a ban
maxretry = 10
findtime = 300

# Ban for 1 hour (escalates with repeat offenders)
bantime  = 3600

# Escalating bans: 1h -> 2h -> 4h -> 8h -> ... up to 1 week
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 604800

# Use the custom Docker-compatible iptables action
action   = iptables-docker[name=nginx-scanner, port="http,https", protocol=tcp]
