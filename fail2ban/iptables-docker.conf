# fail2ban iptables action for Docker environments
# Inserts DROP rules into the DOCKER-USER chain so bans apply
# to traffic forwarded to Docker containers.
#
# Deployed to /etc/fail2ban/action.d/iptables-docker.conf

[Definition]

actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -A f2b-<name> -j RETURN
              iptables -I DOCKER-USER -p <protocol> -m multiport --dports <port> -j f2b-<name>

actionstop = iptables -D DOCKER-USER -p <protocol> -m multiport --dports <port> -j f2b-<name> 2>/dev/null || true
             iptables -F f2b-<name> 2>/dev/null || true
             iptables -X f2b-<name> 2>/dev/null || true

actioncheck = iptables -n -L DOCKER-USER | grep -q 'f2b-<name>'

actionban = iptables -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP

[Init]

name = default
port = http,https
protocol = tcp
