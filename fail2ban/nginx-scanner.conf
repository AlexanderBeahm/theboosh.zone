# fail2ban filter for nginx vulnerability scanners
# Matches requests that indicate automated scanning behavior.
#
# Nginx log format (from nginx.conf):
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent
#   "$http_referer" "$http_user_agent" "$http_x_forwarded_for"

[Definition]

# Requests blocked by nginx (444 = connection closed without response)
# These are requests that hit our map-based blocking rules.
failregex = ^<HOST> -.*" 444 0
            ^<HOST> -.*(\.php|\.asp|\.aspx|\.jsp|\.cgi) HTTP.*" [0-9]+ [0-9]+
            ^<HOST> -.*(wp-login|wp-admin|wp-content|wp-includes|xmlrpc) HTTP.*" [0-9]+ [0-9]+
            ^<HOST> -.*(\.env|\.git|\.svn|\.htaccess|\.htpasswd) HTTP.*" [0-9]+ [0-9]+
            ^<HOST> -.*(phpmyadmin|phpinfo|adminer|cgi-bin|shell\.|alfa\.|bypass\.) HTTP.*" [0-9]+ [0-9]+
            ^<HOST> -.*(\.\./\.\.|%%2e%%2e|%%252e) HTTP.*" [0-9]+ [0-9]+
            ^<HOST> -.*(etc/passwd|etc/shadow|proc/self|/bin/sh|/bin/bash) HTTP.*" [0-9]+ [0-9]+

ignoreregex =