{
    hypnotoad => {
        listen  => ['http://*:3000'],
        workers => 2,
        clients => 100,
        proxy   => 1,
    },
    database => {
        schema => 'public',
        host   => $ENV{POSTGRES_HOST} || 'db',
        port   => $ENV{POSTGRES_PORT} || 5432,
        dbname => $ENV{POSTGRES_DB} || 'thebooshzone_dev',
        user   => $ENV{POSTGRES_USER},
        password => $ENV{POSTGRES_PASSWORD},
    },
    logging => {
        level => 'debug',
    },
    session => {
        secret => $ENV{SESSION_SECRET} || 'development-secret-change-me',
        expiration => 86400, # 24 hours
        secure => 0, # HTTP allowed in development
        httponly => 1, # Prevent JavaScript access
        samesite => 'Lax', # Allow some cross-site requests in development
    },
    uploads => {
        dir => $ENV{UPLOADS_DIR} || '/usr/src/hello-perld/uploads',
        max_size => $ENV{UPLOAD_MAX_SIZE} || 5242880,
        allowed_types => [split(',', $ENV{UPLOAD_ALLOWED_TYPES} || 'image/jpeg,image/png,image/gif,image/webp,image/svg+xml')],
    },
    swagger_enabled => 1, # Enable Swagger UI in development
}
